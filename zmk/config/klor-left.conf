CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y
CONFIG_ZMK_SPLIT_BLE=n
CONFIG_ZMK_SPLIT_WIRED_UART_MODE_INTERRUPT=y
CONFIG_ZMK_SPLIT_WIRED_HALF_DUPLEX_RX_TIMEOUT=20
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

CONFIG_KLOR_OMARCHY=y
CONFIG_KLOR_OMARCHY_RAW_HID=y

CONFIG_ZMK_HID_REPORT_TYPE_HKRO=y
CONFIG_ZMK_HID_KEYBOARD_REPORT_SIZE=6
CONFIG_ZMK_USB_BOOT=y

CONFIG_USB_DEVICE_VID=0x3A3C
CONFIG_USB_DEVICE_PID=0x0001
CONFIG_USB_DEVICE_MANUFACTURER="KLOR"
CONFIG_ZMK_KEYBOARD_NAME="KLOR Omarchy ZMK"

# HID_0 is ZMK keyboard/consumer HID. HID_1 exactly mirrors the QMK Raw HID
# bridge interface: 32-byte IN/OUT reports on usage page 0xFF60, usage 0x61.
CONFIG_USB_HID_DEVICE_COUNT=2
CONFIG_ENABLE_HID_INT_OUT_EP=y
CONFIG_HID_INTERRUPT_EP_MPS=32

# Match QMK Unicode uppercase selection (Shift XOR host Caps Lock).
CONFIG_ZMK_HID_INDICATORS=y
