name: OpenWhispr branch checks

on:
  push:
    branches:
      - openwhispr-dictation
  workflow_dispatch:

concurrency:
  group: openwhispr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install keyring
      - name: Validate Python syntax
        run: |
          python -m py_compile bridge/openwhispr_elevenlabs_shim.py
          python -m py_compile bridge/klor-bridge.py
          python -m py_compile bridge/klor-bridge-windows.py
      - name: Test ElevenLabs adapter
        run: python bridge/test_openwhispr_elevenlabs_shim.py
      - name: Test ZMK control state machine
        run: python zmk/tests/test_control.py
      - name: Validate setup script
        run: bash -n setup.sh

  qmk-build:
    runs-on: ubuntu-latest
    container: ghcr.io/qmk/qmk_cli
    steps:
      - name: Allow action workspaces
        run: git config --global --add safe.directory '*'
      - name: Checkout QMK
        uses: actions/checkout@v4
        with:
          repository: qmk/qmk_firmware
          submodules: recursive
      - name: Checkout KLOR source
        uses: actions/checkout@v4
        with:
          path: klor-source
      - name: Overlay KLOR keyboard
        run: |
          rm -rf keyboards/geigeigeist/klor
          cp -a klor-source/keyboards/geigeigeist/klor keyboards/geigeigeist/klor
      - name: Compile QMK firmware
        run: qmk compile -kb geigeigeist/klor/2040 -km plain
